name: Ingest jobs

# Daily ingestion (claude.md section 6). Scheduled runs only fire from the default branch (main).
#
# GitHub cron is best effort: jobs at the top of the hour (especially 00:00 UTC) are often delayed by
# hours or dropped. So: off-peak minutes, well before Claude's 06:30 IST routine, and a second run as
# a backup. Ingestion is idempotent, so the second run only picks up anything new.
on:
  schedule:
    - cron: "13 21 * * *" # 21:13 UTC = 02:43 IST
    - cron: "43 22 * * *" # 22:43 UTC = 04:13 IST (backup)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Exits non-zero if any source had errors, so GitHub emails the repo owner.
      - run: pnpm ingest
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}

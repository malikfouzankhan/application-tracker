name: Backup database

# Weekly encrypted pg_dump (claude.md section 10, "Ops"). Artifacts of a public repo can be
# downloaded by any signed-in GitHub user, so the dump is encrypted (AES-256) before upload.
# Artifacts expire after 56 days, which keeps the last 8 weekly backups.
#
# Restore: download the artifact, then
#   gpg --batch --passphrase "$BACKUP_PASSPHRASE" -d jobs-YYYY-MM-DD.dump.gpg > jobs.dump
#   pg_restore --no-owner --no-privileges --clean --if-exists -d "$DIRECT_DATABASE_URL" jobs.dump

on:
  schedule:
    - cron: "30 21 * * 6" # Saturday 21:30 UTC = Sunday 03:00 IST, before the 05:30 ingestion
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install PostgreSQL 17 client (matches Supabase)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump and encrypt
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$DIRECT_DATABASE_URL" || { echo "DIRECT_DATABASE_URL secret missing"; exit 1; }
          test ${#BACKUP_PASSPHRASE} -ge 32 || { echo "BACKUP_PASSPHRASE secret missing or shorter than 32 chars"; exit 1; }
          name="jobs-$(date -u +%F).dump"
          # Only the app's schemas: Supabase's own (auth, storage, ...) are managed by Supabase.
          /usr/lib/postgresql/17/bin/pg_dump "$DIRECT_DATABASE_URL" \
            --format=custom --no-owner --no-privileges --schema=public --schema=drizzle \
            --file="$name"
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase-fd 3 \
            --output "$name.gpg" "$name" 3<<<"$BACKUP_PASSPHRASE"
          rm -f "$name"
          ls -l "$name.gpg"
          echo "BACKUP_FILE=$name.gpg" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 56
          if-no-files-found: error
